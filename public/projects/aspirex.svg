  <g filter="url(#aspireShadow)">
    <rect x="228" y="456" width="708" height="180" rx="14" fill="#fff" fill-opacity="0.75"/>
    <text x="252" y="488" font-family="system-ui" font-size="9" fill="#6b6358" letter-spacing="1.5">RECENT ACTIVITY</text>
    <circle cx="272" cy="524" r="20" fill="#4a5d42" opacity="0.15"/>
    <rect x="304" y="514" width="160" height="8" rx="3" fill="#2a2620" opacity="0.55"/>
    <rect x="304" y="530" width="220" height="6" rx="3" fill="#6b6358" opacity="0.3"/>
    <circle cx="272" cy="572" r="20" fill="#c4a882" opacity="0.25"/>
    <rect x="304" y="562" width="140" height="8" rx="3" fill="#2a2620" opacity="0.55"/>
    <rect x="304" y="578" width="200" height="6" rx="3" fill="#6b6358" opacity="0.3"/>
    <circle cx="272" cy="620" r="20" fill="#6b6358" opacity="0.15"/>
    <rect x="304" y="610" width="180" height="8" rx="3" fill="#2a2620" opacity="0.55"/>
    <rect x="304" y="626" width="240" height="6" rx="3" fill="#6b6358" opacity="0.3"/>
  </g>
</svg>
