  <g filter="url(#aspireShadow)">
    <rect x="956" y="148" width="220" height="284" rx="14" fill="#fff" fill-opacity="0.8"/>
    <text x="976" y="178" font-family="system-ui" font-size="9" fill="#6b6358" letter-spacing="1.5">MULTI-TENANT</text>
    <text x="976" y="202" font-family="Georgia, serif" font-size="17" fill="#2a2620">Workspace Overview</text>
    <circle cx="1000" cy="240" r="18" fill="#4a5d42" opacity="0.25"/>
    <circle cx="1044" cy="240" r="18" fill="#c4a882" opacity="0.4"/>
    <circle cx="1088" cy="240" r="18" fill="#6b6358" opacity="0.2"/>
    <circle cx="1132" cy="240" r="18" fill="#4a5d42" opacity="0.15"/>
    <rect x="976" y="272" width="180" height="1" fill="#ddd5c8"/>
    <rect x="976" y="292" width="140" height="7" rx="3" fill="#2a2620" opacity="0.6"/>
    <rect x="976" y="308" width="168" height="6" rx="3" fill="#6b6358" opacity="0.3"/>
    <rect x="976" y="322" width="150" height="6" rx="3" fill="#6b6358" opacity="0.2"/>
    <rect x="976" y="352" width="88" height="28" rx="14" fill="#4a5d42"/>
