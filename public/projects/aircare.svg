<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="600" y1="0" x2="600" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7eb8da"/>
      <stop offset="0.45" stop-color="#a8cce0"/>
      <stop offset="0.75" stop-color="#d4c4a8"/>
      <stop offset="1" stop-color="#e8dcc8"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="airShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2a3a4a" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="980" cy="120" r="48" fill="#ffd966" opacity="0.85" filter="url(#glow)"/>
  <circle cx="980" cy="120" r="36" fill="#ffe699" opacity="0.6"/>

  <!-- Clouds -->
  <ellipse cx="200" cy="100" rx="70" ry="28" fill="#fff" opacity="0.5"/>
  <ellipse cx="260" cy="92" rx="50" ry="22" fill="#fff" opacity="0.45"/>
  <ellipse cx="720" cy="80" rx="60" ry="24" fill="#fff" opacity="0.4"/>
  <ellipse cx="770" cy="74" rx="40" ry="18" fill="#fff" opacity="0.35"/>

  <!-- Header -->
  <g filter="url(#airShadow)">
    <rect x="40" y="36" width="1120" height="56" rx="16" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.4"/>
  </g>
  <circle cx="72" cy="64" r="8" fill="#4a5d42" opacity="0.6"/>
  <path d="M72 72 L72 78" stroke="#4a5d42" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="72" cy="80" r="3" fill="#4a5d42" opacity="0.4"/>
  <text x="92" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#fff" opacity="0.85">Current location</text>
  <text x="92" y="78" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#fff">New Delhi, IN</text>
  <rect x="1040" y="50" width="96" height="28" rx="14" fill="#4a5d42" fill-opacity="0.35" stroke="#fff" stroke-opacity="0.3"/>
  <circle cx="1058" cy="64" r="4" fill="#6fcf6f"/>
  <text x="1070" y="69" font-family="system-ui" font-size="10" fill="#fff" font-weight="600">Live</text>

  <!-- Hero weather -->
  <g filter="url(#airShadow)">
    <rect x="40" y="116" width="520" height="280" rx="20" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <!-- Weather icon -->
  <circle cx="140" cy="220" r="36" fill="#ffd966" opacity="0.9"/>
  <ellipse cx="180" cy="228" rx="32" ry="20" fill="#fff" opacity="0.85"/>
  <ellipse cx="200" cy="222" rx="24" ry="16" fill="#fff" opacity="0.7"/>
  <text x="260" y="200" font-family="system-ui" font-size="14" fill="#fff" opacity="0.9">Partly Cloudy</text>
  <text x="260" y="268" font-family="system-ui" font-size="13" fill="#fff" opacity="0.75">Feels like 26° · H 32° L 22°</text>
  <text x="260" y="320" font-family="Georgia, serif" font-size="88" font-weight="300" fill="#fff">24°</text>

  <!-- AQI Gauge -->
  <g filter="url(#airShadow)">
    <rect x="580" y="116" width="280" height="280" rx="20" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <text x="612" y="156" font-family="system-ui" font-size="10" fill="#fff" opacity="0.8" letter-spacing="1.5">AIR QUALITY INDEX</text>
  <!-- Gauge ring -->
  <circle cx="720" cy="240" r="72" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="10"/>
  <circle cx="720" cy="240" r="72" fill="none" stroke="#6fcf6f" stroke-width="10" stroke-dasharray="320 452" stroke-linecap="round" transform="rotate(-90 720 240)"/>
  <text x="720" y="248" font-family="Georgia, serif" font-size="42" fill="#fff" text-anchor="middle">42</text>
  <text x="720" y="272" font-family="system-ui" font-size="13" fill="#6fcf6f" text-anchor="middle" font-weight="600">Good</text>
  <rect x="612" y="340" width="72" height="28" rx="14" fill="#6fcf6f" fill-opacity="0.25" stroke="#6fcf6f" stroke-opacity="0.4"/>
  <text x="628" y="359" font-family="system-ui" font-size="10" fill="#fff">PM2.5 · 18</text>
  <rect x="696" y="340" width="72" height="28" rx="14" fill="#fff" fill-opacity="0.15"/>
  <text x="712" y="359" font-family="system-ui" font-size="10" fill="#fff" opacity="0.85">PM10 · 32</text>

  <!-- Stats chips -->
  <g filter="url(#airShadow)">
    <rect x="880" y="116" width="280" height="130" rx="20" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <text x="912" y="152" font-family="system-ui" font-size="9" fill="#fff" opacity="0.7" letter-spacing="1">CONDITIONS</text>
  <text x="912" y="182" font-family="system-ui" font-size="12" fill="#fff" opacity="0.85">Wind</text>
  <text x="912" y="204" font-family="Georgia, serif" font-size="22" fill="#fff">12 km/h</text>
  <text x="1020" y="182" font-family="system-ui" font-size="12" fill="#fff" opacity="0.85">Humidity</text>
  <text x="1020" y="204" font-family="Georgia, serif" font-size="22" fill="#fff">58%</text>
  <text x="912" y="232" font-family="system-ui" font-size="12" fill="#fff" opacity="0.85">UV Index</text>
  <text x="912" y="254" font-family="Georgia, serif" font-size="22" fill="#fff">6</text>
  <text x="1020" y="232" font-family="system-ui" font-size="12" fill="#fff" opacity="0.85">Visibility</text>
  <text x="1020" y="254" font-family="Georgia, serif" font-size="22" fill="#fff">8 km</text>

  <g filter="url(#airShadow)">
    <rect x="880" y="266" width="280" height="130" rx="20" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <text x="912" y="302" font-family="system-ui" font-size="9" fill="#fff" opacity="0.7" letter-spacing="1">POLLEN &amp; ALLERGENS</text>
  <rect x="912" y="316" width="216" height="8" rx="4" fill="#fff" opacity="0.2"/>
  <rect x="912" y="316" width="72" height="8" rx="4" fill="#6fcf6f" opacity="0.7"/>
  <text x="912" y="346" font-family="system-ui" font-size="11" fill="#fff" opacity="0.85">Low pollen count today</text>
  <text x="912" y="374" font-family="system-ui" font-size="11" fill="#fff" opacity="0.65">Safe for outdoor activities</text>

  <!-- Hourly forecast -->
  <g filter="url(#airShadow)">
    <rect x="40" y="420" width="720" height="215" rx="20" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <text x="68" y="456" font-family="system-ui" font-size="10" fill="#fff" opacity="0.75" letter-spacing="1.5">HOURLY FORECAST</text>
  <!-- Hour columns -->
  <g font-family="system-ui" fill="#fff">
    <text x="80" y="492" font-size="11" opacity="0.7">Now</text>
    <circle cx="92" cy="520" r="10" fill="#ffd966" opacity="0.9"/>
    <text x="84" y="552" font-size="14" font-weight="600">24°</text>
    <text x="160" y="492" font-size="11" opacity="0.7">2PM</text>
    <circle cx="172" cy="520" r="10" fill="#ffd966" opacity="0.85"/>
    <text x="164" y="552" font-size="14" font-weight="600">27°</text>
    <text x="240" y="492" font-size="11" opacity="0.7">4PM</text>
    <ellipse cx="252" cy="520" rx="12" ry="8" fill="#fff" opacity="0.7"/>
    <text x="244" y="552" font-size="14" font-weight="600">28°</text>
    <text x="320" y="492" font-size="11" opacity="0.7">6PM</text>
    <ellipse cx="332" cy="520" rx="12" ry="8" fill="#fff" opacity="0.65"/>
    <text x="324" y="552" font-size="14" font-weight="600">26°</text>
    <text x="400" y="492" font-size="11" opacity="0.7">8PM</text>
    <ellipse cx="412" cy="520" rx="12" ry="8" fill="#fff" opacity="0.6"/>
    <text x="404" y="552" font-size="14" font-weight="600">24°</text>
    <text x="480" y="492" font-size="11" opacity="0.7">10PM</text>
    <circle cx="492" cy="520" r="8" fill="#fff" opacity="0.4"/>
    <text x="484" y="552" font-size="14" font-weight="600">22°</text>
    <text x="560" y="492" font-size="11" opacity="0.7">12AM</text>
    <circle cx="572" cy="520" r="8" fill="#fff" opacity="0.35"/>
    <text x="564" y="552" font-size="14" font-weight="600">21°</text>
    <text x="640" y="492" font-size="11" opacity="0.7">2AM</text>
    <circle cx="652" cy="520" r="8" fill="#fff" opacity="0.3"/>
    <text x="644" y="552" font-size="14" font-weight="600">20°</text>
  </g>
  <!-- Mini chart line -->
  <path d="M80 590 Q200 560 320 570 T560 580 T720 595" stroke="#fff" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- 7-day forecast -->
  <g filter="url(#airShadow)">
    <rect x="780" y="420" width="380" height="215" rx="20" fill="url(#glassCard)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <text x="808" y="456" font-family="system-ui" font-size="10" fill="#fff" opacity="0.75" letter-spacing="1.5">7-DAY FORECAST</text>
  <g font-family="system-ui" font-size="12" fill="#fff">
    <text x="808" y="492" opacity="0.85">Thu</text>
    <circle cx="900" cy="486" r="8" fill="#ffd966" opacity="0.85"/>
    <text x="960" y="492" opacity="0.7">32° / 22°</text>
    <rect x="1050" y="476" width="36" height="18" rx="9" fill="#6fcf6f" fill-opacity="0.3"/>
    <text x="1058" y="489" font-size="9" fill="#fff">AQI 42</text>
    <text x="808" y="532" opacity="0.85">Fri</text>
    <ellipse cx="900" cy="526" rx="10" ry="7" fill="#fff" opacity="0.7"/>
    <text x="960" y="532" opacity="0.7">30° / 21°</text>
    <rect x="1050" y="516" width="36" height="18" rx="9" fill="#6fcf6f" fill-opacity="0.3"/>
    <text x="1058" y="529" font-size="9" fill="#fff">AQI 48</text>
    <text x="808" y="572" opacity="0.85">Sat</text>
    <ellipse cx="900" cy="566" rx="10" ry="7" fill="#fff" opacity="0.65"/>
    <text x="960" y="572" opacity="0.7">29° / 20°</text>
    <rect x="1050" y="556" width="36" height="18" rx="9" fill="#ffd966" fill-opacity="0.3"/>
    <text x="1058" y="569" font-size="9" fill="#fff">AQI 65</text>
    <text x="808" y="612" opacity="0.85">Sun</text>
    <circle cx="900" cy="606" r="8" fill="#ffd966" opacity="0.9"/>
    <text x="960" y="612" opacity="0.7">31° / 22°</text>
    <rect x="1050" y="596" width="36" height="18" rx="9" fill="#6fcf6f" fill-opacity="0.3"/>
    <text x="1058" y="609" font-size="9" fill="#fff">AQI 38</text>
  </g>
</svg>
